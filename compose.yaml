services:
  app:
    image: node:22-bookworm-slim
    container_name: restaurant_container
    ports:
      - 3004:3004
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: tail -f /dev/null
    environment:
      - NODE_ENV=development
    working_dir: /app

volumes:
  node_modules:
    driver: local
